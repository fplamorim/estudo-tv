# Em cada tag vX.Y.Z: compila o APK de release, assina-o com a keystore dos segredos do repositório
# e publica estudo-tv.apk na Release. Segredos: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Confirmar a tag
        run: |
          echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "A tag tem de ser vX.Y.Z"; exit 1; }

      - name: Confirmar os segredos
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "Falta o segredo $v (Settings → Secrets and variables → Actions)."; exit 1; }
          done

      - name: Compilar e assinar
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export KEYSTORE_FILE="$RUNNER_TEMP/estudo-tv.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          export VERSAO="${GITHUB_REF_NAME#v}"
          ./gradlew assembleRelease testDebugUnitTest --console=plain
          rm -f "$KEYSTORE_FILE"

      - name: Verificar a assinatura
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "^Signer #1 certificate (DN|SHA-256)"
          cp app/build/outputs/apk/release/app-release.apk estudo-tv.apk
          sha256sum estudo-tv.apk | tee estudo-tv.apk.sha256

      - name: Publicar a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(cut -d' ' -f1 estudo-tv.apk.sha256)
          {
            echo "Estudo TV ${GITHUB_REF_NAME#v}"
            echo
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            echo
            echo "SHA-256 do estudo-tv.apk: \`$SHA\`"
          } > notas.md
          gh release create "$GITHUB_REF_NAME" estudo-tv.apk --title "Estudo TV ${GITHUB_REF_NAME#v}" --notes-file notas.md
