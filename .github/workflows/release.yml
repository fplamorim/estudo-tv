# Em cada tag vX.Y.Z (ou à mão, em Actions → Release → Run workflow, com a versão): compila o APK de release, assina-o com a keystore dos segredos do repositório
# e publica estudo-tv.apk na Release. Segredos: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão (X.Y.Z, sem o v)"
        required: true
      notas:
        description: "Notas da versão (aparecem na TV ao atualizar)"
        required: false
        default: ""

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.versao) || github.ref_name }}

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Confirmar a tag
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "A versão tem de ser X.Y.Z"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Já existe a Release $TAG"; exit 1; fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Confirmar os segredos
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "Falta o segredo $v (Settings → Secrets and variables → Actions)."; exit 1; }
          done

      - name: Compilar e assinar
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export KEYSTORE_FILE="$RUNNER_TEMP/estudo-tv.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          export VERSAO="${TAG#v}"
          ./gradlew assembleRelease testDebugUnitTest --console=plain
          rm -f "$KEYSTORE_FILE"

      - name: Verificar a assinatura
        run: |
          ls "$ANDROID_HOME"/build-tools/
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "A usar: $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk estudo-tv.apk
          sha256sum estudo-tv.apk | tee estudo-tv.apk.sha256

      - name: Publicar a Release (cria a tag, se for preciso)
        env:
          GH_TOKEN: ${{ github.token }}
          NOTAS: ${{ inputs.notas }}
        run: |
          SHA=$(cut -d' ' -f1 estudo-tv.apk.sha256)
          {
            echo "Estudo TV ${TAG#v}"
            echo
            if [ -n "$NOTAS" ]; then echo "$NOTAS"; else git tag -l --format='%(contents)' "$TAG"; fi
            echo
            echo "SHA-256 do estudo-tv.apk: \`$SHA\`"
          } > notas.md
          gh release create "$TAG" estudo-tv.apk --target "$GITHUB_SHA" --title "Estudo TV ${TAG#v}" --notes-file notas.md
